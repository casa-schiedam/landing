# Photos on the "From my kitchen" page (kitchen.html), in display order.
#
# To add a photo:
#   1. Put a big version (max ~1600px) in images/kitchen/ and a small one
#      (about 700px wide) with the SAME name in images/kitchen/thumb/
#   2. Add an entry below: file name, category, and a short description of
#      what's in the photo (Google and screen readers read it).
#      width/height are the small version's size in pixels; they stop the
#      grid jumping while photos load. Optional — leave them out if unsure.
# Categories: pasta  = handmade pasta
#             dishes = pasta & plates
#             bread  = bread & dough
#             oven   = oven dishes & sweets

